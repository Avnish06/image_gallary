<!DOCTYPE html>
<html>
<head>
  <title>Image Gallery</title>
</head>
<body>
  <h1>Upload Image</h1>
  <form id="uploadForm" enctype="multipart/form-data">
    <input type="file" name="file" />
    <button type="submit">Upload</button>
  </form>

  <h2>Gallery</h2>
  <div id="gallery"></div>

  <script>
    // Upload image
    document.getElementById("uploadForm").onsubmit = async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const response = await fetch("/images", {
        method: "POST",
        body: formData
      });

      if (!response.ok) {
        const error = await response.json().catch(() => ({ error: "Upload failed" }));
        alert(error.error || "Upload failed");
        return;
      }

      e.target.reset();
      loadGallery();
    };

    async function deleteImage(id) {
      const response = await fetch(`/images/${id}`, {
        method: "DELETE"
      });

      const result = await response.json().catch(() => ({ error: "Delete failed" }));
      if (!response.ok) {
        alert(result.error || "Delete failed");
        return;
      }

      loadGallery();
    }

    // Load gallery
    function loadGallery() {
      fetch("/images")
        .then(res => res.json())
        .then(data => {
          const gallery = document.getElementById("gallery");
          gallery.innerHTML = "";

          data.forEach(img => {
            const wrap = document.createElement("div");
            wrap.style.display = "inline-block";
            wrap.style.margin = "8px";
            wrap.style.verticalAlign = "top";

            const el = document.createElement("img");
            el.src = img.url;
            el.alt = img.title;
            el.style.width = "200px";
            el.style.display = "block";
            el.style.marginBottom = "8px";

            const delBtn = document.createElement("button");
            delBtn.type = "button";
            delBtn.textContent = "Delete";
            delBtn.addEventListener("click", () => deleteImage(img.id));

            wrap.appendChild(el);
            wrap.appendChild(delBtn);
            gallery.appendChild(wrap);
          });
        })
        .catch(() => {
          document.getElementById("gallery").innerHTML = "Unable to load images.";
        });
    }

    loadGallery();
  </script>
</body>
</html>
